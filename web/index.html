<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find off-campus student rooms and compatible roommates in Ghana with StudentPadGH.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StudentPadGH">
  <link rel="apple-touch-icon" href="icons/studentpadgh-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/studentpadgh-192.png"/>

  <title>StudentPadGH</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup-splash" aria-label="StudentPadGH is loading">
    <img src="studentpadgh-launch-screen.png" alt="StudentPadGH — roommates made right">
  </div>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #F9FBF9; }
    #startup-splash {
      position: fixed; inset: 0; z-index: 9999; display: grid;
      place-items: center; background: #F9FBF9;
    }
    #startup-splash img {
      display: block; width: 100%; height: 100%; object-fit: contain;
    }
    #startup-splash.hidden { display: none; }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('startup-splash')?.classList.add('hidden');
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
